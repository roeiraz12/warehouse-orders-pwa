name: Deploy demo to GitHub Pages

# Publishes the demo build (in-browser sample data, no backend) to
# https://roeiraz12.github.io/warehouse-orders-pwa/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build demo
        # No VITE_API_URL -> demo mode (mockRepository). Served from the repo sub-path.
        run: npm run build
        env:
          VITE_BASE: /warehouse-orders-pwa/
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
